<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> <!-- zoom engedélyezve (akadálymentesség) -->
<title>Helyesírás Kaland</title>
<link rel="stylesheet" href="style.css">   <!-- az eredeti <style> tartalma -->
<link rel="stylesheet" href="extra.css">   <!-- az új stílusok -->
</head>
<body>
<!-- Felső információs sáv (a részletek a Statisztika képernyőn vannak) -->
<header class="monitor-bar">
  <span class="mon-left">
    <span class="mon-chip">✅ Ma: <b id="mon-today">0</b></span>
    <span class="mon-chip" id="mon-100">🏆 <b id="mon-prog">0</b>/100</span>
    <button id="mon-turbo" class="mon-turbo" hidden></button>
  </span>
  <button id="mon-sync" class="sync-badge">☁️ Helyi mód</button>
</header>

<section id="scr-home" class="screen on">
  <div class="hero">
    <div class="mascot">🦉</div>
    <h1>Helyesírás Kaland</h1>
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap;">
      <span class="hello" id="hello-txt" style="margin:0;">Szia!</span>
      <button id="btn-switch-user" class="smallbtn">👤 Váltás</button>
      <button id="btn-stats" class="smallbtn">📊 Statisztika</button>
      <button id="btn-parent" class="smallbtn">👨‍👩‍👧 Szülői nézet</button>
      <button id="btn-album" class="smallbtn">📖 Gyűjtemény</button>
    </div>
    <div class="statsrow">
      <div class="pill">⭐ <span id="st-pts">0</span> pont</div>
      <div class="pill">🏆 <span id="st-done">0</span> elsajátított szó</div>
      <div class="pill">🔥 <span id="st-streak">0</span> nap</div>
      <div class="pill">🎯 ma <span id="st-goal">0/10</span></div>
    </div>
    <div class="rankbox">
      <div class="rankname" id="rank-name">Kezdő Betűvadász</div>
      <div class="bar"><i id="rank-bar"></i></div>
      <div class="barlabel"><span id="rank-cur">0 pont</span><span id="rank-next"></span></div>
    </div>
    <div class="levels" id="levels" role="group" aria-label="Nehézségi szint"></div>
    <div id="lock-note" class="lock-note"></div>
  </div>

  <div class="menu">
    <button class="big b-main" id="btn-mixed"><span class="ic">🚀</span>Vegyes kaland (10 feladat)<small>Hosszú mássalhangzók, j–ly, betűpótlás és szókirakó</small></button>
    <button class="big b-choice" id="btn-choice"><span class="ic">🎯</span>Rövid vagy hosszú?<small>Válaszd ki a helyes mássalhangzót!</small></button>
    <button class="big b-jly" id="btn-jly"><span class="ic">✍️</span>j vagy ly gyakorló<small>Döntsd el: pontos j vagy ly!</small></button>
    <button class="big b-gap" id="btn-gap"><span class="ic">🧩</span>Betűpótló<small>Pótold a hiányzó mássalhangzót!</small></button>
    <button class="big b-tiles" id="btn-tiles"><span class="ic">🔤</span>Betűkirakó<small>Rakd ki a szót, 2 segítséggel!</small></button>
    <button class="big b-pairs" id="btn-pairs" style="font-size:16px;padding:14px 10px;"><span class="ic" style="font-size:24px;">⚖️</span>Jelentéskülönbségek<small style="font-size:11px;">fejjel–fejel, hal–hall...</small></button>
    <button class="big b-mistakes" id="btn-mistakes" style="font-size:16px;padding:14px 10px;display:none;"><span class="ic" style="font-size:24px;">🩹</span>Ismétlő kör (<span id="mistake-cnt">0</span> szó)<small style="font-size:11px;">Hibás és esedékes szavak</small></button>
  </div>
</section>

<section id="scr-users" class="screen">
  <div class="namebox">
    <div style="font-size:56px" class="mascot">🦉</div>
    <h2>Ki játszik most?</h2>
    <div class="plist" id="user-list"></div>
    <div id="avatar-picker" style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0;"></div>
    <input type="text" id="new-user-inp" placeholder="Új név beírása..." maxlength="18" aria-label="Új játékos neve">
    <button class="primary" style="width:100%" id="btn-add-user">Hozzáadás és indítás</button>
    <button class="secondary" style="width:100%;margin-top:12px" id="btn-users-back">← Vissza</button>
  </div>
</section>

<section id="scr-quiz" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="btn-quit" aria-label="Kezdőlap">🏠</button>
    <div class="progress"><i id="q-prog"></i></div>
    <div class="combo" id="q-combo"></div>
    <div class="score" id="q-score">0 p</div>
  </div>
  <div class="card" id="q-card">
    <div class="tag" id="q-tag">Feladat</div>
    <div class="qtitle" id="q-title"></div>
    <div id="q-body"></div>
  </div>
</section>

<section id="scr-res" class="screen">
  <div class="card result">
    <div class="stars" id="res-stars">⭐⭐⭐</div>
    <h2 id="res-head" style="font-size:30px;margin:6px 0">Szép munka!</h2>
    <p id="res-sub" style="font-size:19px;color:var(--soft);font-weight:700"></p>
    <div id="res-badges" class="badgegrid"></div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap">
      <button class="primary" id="btn-again">Újabb kör</button>
      <button class="secondary" id="btn-home">Kezdőlap</button>
    </div>
  </div>
</section>

<section id="scr-stats" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="btn-stats-back" aria-label="Vissza">←</button>
    <h2 style="margin:0">Statisztika</h2>
  </div>
  <div id="stats-body"></div>
</section>

<section id="scr-album" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="btn-album-back" aria-label="Vissza">←</button>
    <h2 style="margin:0">Gyűjtemény</h2>
  </div>
  <div id="album-body"></div>
</section>

<section id="scr-parent" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="btn-parent-back" aria-label="Vissza">←</button>
    <h2 style="margin:0">Szülői nézet</h2>
  </div>
  <div id="parent-body"></div>
</section>

<!-- Visszajelző sáv: a képernyőolvasók felolvassák -->
<div class="sheet" id="sheet" role="status" aria-live="polite">
  <div class="in">
    <div>
      <div class="head" id="sh-head"></div>
      <div class="full" id="sh-full"></div>
      <div class="why" id="sh-why"></div>
      <input id="sh-retype" class="typeinp retype" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Írd le a helyes alakot">
    </div>
    <button class="primary" id="sh-next">Tovább ➔</button>
  </div>
</div>

<div id="modal" class="modal"><div class="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script type="module" src="app.js"></script>
</body>
</html>
