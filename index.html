<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Helyesírás Kaland</title>
<style>
  :root {
    --bg1: #fff7ed; --bg2: #e0f2fe;
    --ink: #1e293b; --soft: #64748b;
    --card: #ffffff; --line: #e2e8f0;
    --pri: #7c3aed; --pri2: #a78bfa;
    --ok: #16a34a; --okbg: #dcfce7;
    --bad: #dc2626; --badbg: #fee2e2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    overflow-x: hidden;
    padding-bottom: 64px;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .screen { display: none; min-height: calc(100vh - 64px); padding: 16px; max-width: 960px; margin: 0 auto; flex-direction: column; }
  .screen.on { display: flex; }

  .hero { text-align: center; margin-top: 6px; }
  .mascot { font-size: 72px; line-height: 1; display: inline-block; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
  h1 {
    font-size: 38px; margin: 4px 0 0; letter-spacing: .5px;
    background: linear-gradient(90deg, #7c3aed, #ec4899, #f59e0b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hello { font-size: 19px; color: var(--soft); margin: 4px 0 12px; font-weight: 700; }
  .statsrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pill {
    background: var(--card); border-radius: 16px; padding: 8px 16px; font-size: 17px; font-weight: 800;
    box-shadow: 0 3px 0 var(--line); display: flex; align-items: center; gap: 6px;
  }
  .rankbox {
    background: var(--card); border-radius: 20px; padding: 12px 18px;
    box-shadow: 0 4px 0 var(--line); max-width: 620px; margin: 0 auto 16px; width: 100%;
  }
  .rankname { font-size: 19px; font-weight: 800; }
  .bar { height: 14px; background: #f1f5f9; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #a78bfa, #7c3aed); transition: width .6s; }
  .barlabel { display: flex; justify-content: space-between; font-size: 13px; color: var(--soft); margin-top: 5px; font-weight: 700; }

  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 620px; margin: 0 auto; width: 100%; }
  .big {
    border: 0; border-radius: 22px; padding: 18px 12px; font-size: 20px; font-weight: 800; color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .08s;
    display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center;
  }
  .big small { font-size: 13px; font-weight: 600; opacity: .92; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .big .ic { font-size: 32px; }
  .b-main { grid-column: 1 / -1; background: linear-gradient(135deg, #8b5cf6, #ec4899); font-size: 24px; padding: 20px; }
  .b-choice { background: linear-gradient(135deg, #06b6d4, #2563eb); }
  .b-jly { background: linear-gradient(135deg, #f97316, #ea580c); }
  .b-gap { background: linear-gradient(135deg, #eab308, #ca8a04); }
  .b-tiles { background: linear-gradient(135deg, #22c55e, #0d9488); }
  .b-pairs { grid-column: 1 / -1; background: linear-gradient(135deg, #ec4899, #be185d); }
  .b-mistakes { grid-column: 1 / -1; background: linear-gradient(135deg, #ef4444, #b91c1c); }

  .namebox {
    max-width: 480px; margin: 30px auto; background: var(--card); border-radius: 28px;
    padding: 26px; text-align: center; box-shadow: 0 6px 0 var(--line); width: 100%;
  }
  .namebox input {
    font: inherit; font-size: 24px; padding: 12px; border-radius: 16px; border: 3px solid var(--line);
    width: 100%; text-align: center; margin: 14px 0; user-select: text;
  }
  .namebox input:focus { outline: none; border-color: var(--pri2); }
  .plist { display: grid; gap: 10px; margin-bottom: 16px; }
  .profile {
    display: flex; align-items: center; justify-content: space-between;
    border: 3px solid var(--line); background: #fff; border-radius: 18px;
    padding: 12px 16px; box-shadow: 0 4px 0 var(--line); font-weight: 800; font-size: 19px;
  }
  .profile.cur { border-color: var(--pri2); background: #f5f3ff; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .iconbtn {
    width: 50px; height: 50px; border-radius: 16px; border: 0; background: var(--card);
    font-size: 22px; box-shadow: 0 4px 0 var(--line); flex: none;
  }
  .progress { flex: 1; height: 18px; background: rgba(255,255,255,.85); border-radius: 99px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #34d399, #16a34a); border-radius: 99px; transition: width .35s; }
  .score {
    font-size: 19px; font-weight: 800; background: var(--card); padding: 9px 14px;
    border-radius: 16px; box-shadow: 0 4px 0 var(--line); min-width: 82px; text-align: center;
  }
  .combo { font-size: 17px; font-weight: 900; color: #ea580c; min-width: 56px; text-align: center; }

  .card {
    background: var(--card); border-radius: 28px; padding: 24px 20px;
    box-shadow: 0 8px 0 var(--line); text-align: center;
  }
  .tag {
    display: inline-block; font-size: 14px; font-weight: 800; color: #fff;
    padding: 5px 14px; border-radius: 99px; background: var(--pri);
  }
  .qtitle { font-size: 18px; color: var(--soft); font-weight: 700; margin: 12px 0 8px; }
  .word-display { font-size: 40px; font-weight: 900; line-height: 1.3; margin: 10px 0; letter-spacing: 1px; }
  .sentence-display { font-size: 24px; font-weight: 800; line-height: 1.4; margin: 10px 0; }
  .clue-box {
    background: #fef9c3; border: 2px solid #fde047; border-radius: 18px;
    padding: 12px 16px; font-size: 20px; font-weight: 800; color: #854d0e;
    margin: 10px auto 6px; max-width: 680px; line-height: 1.35;
  }
  .gap {
    display: inline-block; min-width: 68px; border-bottom: 5px dashed var(--pri2);
    color: var(--pri); padding: 0 6px;
  }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
  .opt {
    border: 3px solid var(--line); background: #fff; border-radius: 20px; padding: 16px 14px;
    font-size: 26px; font-weight: 800; box-shadow: 0 5px 0 var(--line); transition: transform .08s;
  }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  .opt.ok { border-color: var(--ok); background: var(--okbg); box-shadow: 0 5px 0 #86efac; color: var(--ok); }
  .opt.bad { border-color: var(--bad); background: var(--badbg); box-shadow: 0 5px 0 #fca5a5; color: var(--bad); animation: shake .4s; }
  .opt.dim { opacity: .45; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

  .slotrow {
    display: flex; flex-wrap: wrap; gap: 8px; min-height: 68px; padding: 10px;
    margin-top: 14px; border-radius: 20px; background: #f8fafc; border: 3px dashed var(--line);
    justify-content: center; align-items: center;
  }
  .tiles { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; justify-content: center; }
  .tile {
    border: 3px solid #ddd6fe; background: #f5f3ff; border-radius: 15px; padding: 10px 16px;
    font-size: 26px; font-weight: 900; box-shadow: 0 4px 0 #ddd6fe; min-width: 52px;
  }
  .tile:active { transform: translateY(3px); box-shadow: 0 2px 0 #ddd6fe; }
  .tile.used { visibility: hidden; }
  .tile.placed { background: #fff; border-color: var(--pri2); box-shadow: 0 4px 0 var(--pri2); }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 52px; padding: 16px 16px 18px;
    transform: translateY(150%); transition: transform .28s cubic-bezier(.2,1.3,.4,1); z-index: 20;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  .sheet.on { transform: none; }
  .sheet .in { max-width: 960px; margin: 0 auto; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
  .sheet.ok { background: var(--okbg); border-top: 4px solid #86efac; }
  .sheet.bad { background: var(--badbg); border-top: 4px solid #fca5a5; }
  .sheet .head { font-size: 22px; font-weight: 900; }
  .sheet.ok .head { color: var(--ok); }
  .sheet.bad .head { color: var(--bad); }
  .sheet .full { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .primary {
    border: 0; border-radius: 18px; padding: 13px 24px; font-size: 20px; font-weight: 900;
    color: #fff; background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 4px 0 #5b21b6;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #5b21b6; }
  .secondary {
    border: 0; border-radius: 16px; padding: 11px 18px; font-size: 17px; font-weight: 800;
    background: #f1f5f9; box-shadow: 0 4px 0 var(--line);
  }

  .result { text-align: center; margin-top: 20px; }
  .stars { font-size: 64px; letter-spacing: 6px; margin: 10px 0; }
  .footer { text-align: center; margin-top: 16px; }
  .ghost { background: rgba(255,255,255,.75); border: 0; border-radius: 14px; padding: 9px 15px; font-size: 14px; font-weight: 700; color: var(--soft); }

  .monitor-bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 52px;
    background: #1e293b; color: #f8fafc; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    padding: 0 12px; font-size: 14px; font-weight: 700;
    box-shadow: 0 -2px 10px rgba(0,0,0,.15);
  }
  .monitor-inner {
    max-width: 960px; width: 100%;
    display: flex; justify-content: space-around; align-items: center; gap: 8px;
  }
  .mon-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .mon-val {
    background: #334155; color: #38bdf8; padding: 3px 9px;
    border-radius: 8px; font-weight: 900; font-size: 15px;
  }
  .mon-val.ok { color: #4ade80; }
  .mon-val.gold { color: #fbbf24; }

  @media (max-width: 640px) {
    .menu, .opts { grid-template-columns: 1fr; }
    .word-display { font-size: 32px; }
    .sheet .in { flex-direction: column; text-align: center; }
    .monitor-bar { height: auto; min-height: 52px; padding: 6px 8px; font-size: 12px; }
    .monitor-inner { flex-wrap: wrap; justify-content: center; gap: 6px 14px; }
  }
</style>
</head>
<body>

<section id="scr-home" class="screen on">
  <div class="hero">
    <div class="mascot">🦉</div>
    <h1>Helyesírás Kaland</h1>
    <div class="hello" id="hello-txt">Szia!</div>
    <div class="statsrow">
      <div class="pill">⭐ <span id="st-pts">0</span> pont</div>
      <div class="pill">🏆 <span id="st-done">0</span> hibátlan szó</div>
    </div>
    <div class="rankbox">
      <div class="rankname" id="rank-name">Kezdő Betűvadász</div>
      <div class="bar"><i id="rank-bar"></i></div>
      <div class="barlabel"><span id="rank-cur">0 pont</span><span id="rank-next">Következő szint: 150 pont</span></div>
    </div>
  </div>

  <div class="menu">
    <button class="big b-main" id="btn-mixed">
      <span class="ic">🚀</span>
      Vegyes kaland (10 feladat)
      <small>Hosszú mássalhangzók, j–ly, betűpótlás és szókirakó</small>
    </button>
    <button class="big b-choice" id="btn-choice">
      <span class="ic">🎯</span>
      Rövid vagy hosszú?
      <small>Válaszd ki a helyes mássalhangzót!</small>
    </button>
    <button class="big b-jly" id="btn-jly">
      <span class="ic">✍️</span>
      j vagy ly gyakorló
      <small>Döntsd el: pontos j vagy ly!</small>
    </button>
    <button class="big b-gap" id="btn-gap">
      <span class="ic">🧩</span>
      Betűpótló
      <small>Pótold a hiányzó mássalhangzót!</small>
    </button>
    <button class="big b-tiles" id="btn-tiles">
      <span class="ic">🔤</span>
      Betűkirakó
      <small>Rakd ki a szót a betűcsempékből!</small>
    </button>
    <button class="big b-pairs" id="btn-pairs">
      <span class="ic">⚖️</span>
      Jelentéskülönbségek
      <small>fejjel–fejel, hal–hall, helység–helyiség...</small>
    </button>
    <button class="big b-mistakes" id="btn-mistakes" style="display:none">
      <span class="ic">🩹</span>
      Hibajavító kör (<span id="mistake-cnt">0</span> szó)
      <small>Gyakorold újra, amit elrontottál!</small>
    </button>
  </div>

  <div class="footer">
    <button class="ghost" id="btn-switch-user">👤 Játékos váltása</button>
  </div>
</section>

<section id="scr-users" class="screen">
  <div class="namebox">
    <div style="font-size:56px">🦉</div>
    <h2>Ki játszik most?</h2>
    <div class="plist" id="user-list"></div>
    <input type="text" id="new-user-inp" placeholder="Új név beírása..." maxlength="18">
    <button class="primary" style="width:100%" id="btn-add-user">Hozzáadás és indítás</button>
  </div>
</section>

<section id="scr-quiz" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="btn-quit">🏠</button>
    <div class="progress"><i id="q-prog"></i></div>
    <div class="combo" id="q-combo"></div>
    <div class="score" id="q-score">0 p</div>
  </div>

  <div class="card" id="q-card">
    <div class="tag" id="q-tag">Feladat</div>
    <div class="qtitle" id="q-title">Válaszd ki a helyeset!</div>
    <div id="q-body"></div>
  </div>
</section>

<section id="scr-res" class="screen">
  <div class="card result">
    <div class="stars" id="res-stars">⭐⭐⭐</div>
    <h2 id="res-head" style="font-size:30px;margin:6px 0">Szép munka!</h2>
    <p id="res-sub" style="font-size:19px;color:var(--soft);font-weight:700"></p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap">
      <button class="primary" id="btn-again">Újabb kör</button>
      <button class="secondary" id="btn-home">Kezdőlap</button>
    </div>
  </div>
</section>

<div class="sheet" id="sheet">
  <div class="in">
    <div>
      <div class="head" id="sh-head">Helyes!</div>
      <div class="full" id="sh-full"></div>
    </div>
    <button class="primary" id="sh-next">Tovább ➔</button>
  </div>
</div>

<footer class="monitor-bar">
  <div class="monitor-inner">
    <div class="mon-item">📚 Összes szó: <span class="mon-val" id="mon-total">0</span></div>
    <div class="mon-item">🎯 Már gyakorolva: <span class="mon-val gold" id="mon-practiced">0</span></div>
    <div class="mon-item">✅ Most hibátlan: <span class="mon-val ok" id="mon-session-ok">0</span></div>
  </div>
</footer>

<script>
const CUSTOM_CLUES = {
  "Nelli": "Lánynév, a Kornélia rövidített alakja.",
  "loccsan": "A víz hirtelen csapódva ilyen hangot ad.",
  "csepp": "Egyetlen pici gömbölyű vízrészecske.",
  "hipp-hopp": "Nagyon gyorsan, egyik pillanatról a másikra (kötőjeles szó).",
  "kipp-kopp": "Kopogást utánzó hangutánzó szó (kötőjellel).",
  "hullám": "A tenger vagy a tó vizének fodrozódó mozgása.",
  "duzzad": "Megdagad, megnagyobbodik, feszül.",
  "durran": "A lufi kipukkadásakor hallható erős, éles hang.",

  "könny": "Síráskor a szemünkből kicsorduló sós vízcsepp.",

  "fütty": "Összecsücsörített ajkakkal adott éles, magas hang.",
  "bükk": "Sima, szürke kérgű, magas erdei lombhullató fa.",
  "dinnye": "Kívül zöld, belül piros és lédús nyári gyümölcs.",

  "dugattyú": "A motor hengerében fel-le mozgó alkatrész.",

  "dekagramm": "Tömegmértékegység (10 gramm = 1 dkg).",
  "kilogramm": "A tömeg alapmértékegysége (1000 gramm = 1 kg).",

  "kompót": "Cukros vízben főtt gyümölcsbefőtt.",
  "orrszarvú": "Orrán egy vagy két szarvat viselő hatalmas afrikai állat.",
  "varrónő": "Ruhák készítésével és javításával foglalkozó szakember.",
  "Kossuth": "Híres magyar államférfi az 1848–49-es szabadságharc idején.",
  "kazetta": "Régi mágnesszalagos hang- vagy videóhordozó.",
  "múzeum": "Régi kincseket, műalkotásokat bemutató kiállítóhely.",

  "meszel": "Fehér mésztejjel befesti a falat."
};

const LONG_PATTERNS = [
  { long: "ccs", short: "cs" }, { long: "ggy", short: "gy" }, { long: "lly", short: "ly" },
  { long: "nny", short: "ny" }, { long: "ssz", short: "sz" }, { long: "tty", short: "ty" },
  { long: "zzs", short: "zs" }, { long: "bb", short: "b" },  { long: "cc", short: "c" },
  { long: "dd", short: "d" },   { long: "ff", short: "f" },  { long: "gg", short: "g" },
  { long: "hh", short: "h" },   { long: "jj", short: "j" },  { long: "kk", short: "k" },
  { long: "ll", short: "l" },   { long: "mm", short: "m" },  { long: "nn", short: "n" },
  { long: "pp", short: "p" },   { long: "rr", short: "r" },  { long: "ss", short: "s" },
  { long: "tt", short: "t" },   { long: "vv", short: "v" },  { long: "zz", short: "z" }
];

function analyzeWord(word) {
  const lower = word.toLowerCase();
  for (const pat of LONG_PATTERNS) {
    const idx = lower.indexOf(pat.long);
    if (idx !== -1) {
      const actualLong = word.slice(idx, idx + pat.long.length);
      const actualShort = (idx === 0 && word[0] === word[0].toUpperCase())
        ? pat.short[0].toUpperCase() + pat.short.slice(1)
        : pat.short;
      const wrongWord = word.slice(0, idx) + actualShort + word.slice(idx + pat.long.length);
      const gappedWord = word.slice(0, idx) + "___" + word.slice(idx + pat.long.length);
      return { word, wrongWord, gappedWord, longPart: actualLong, shortPart: actualShort, hasLong: true };
    }
  }
  const shortFallback = [
    { short: "ny", long: "nny" }, { short: "gy", long: "ggy" }, { short: "ty", long: "tty" },
    { short: "cs", long: "ccs" }, { short: "sz", long: "ssz" },
    { short: "b", long: "bb" },   { short: "d", long: "dd" },   { short: "g", long: "gg" },
    { short: "k", long: "kk" },   { short: "l", long: "ll" },   { short: "m", long: "mm" },
    { short: "n", long: "nn" },   { short: "p", long: "pp" },   { short: "r", long: "rr" },
    { short: "s", long: "ss" },   { short: "t", long: "tt" },   { short: "z", long: "zz" }
  ];
  for (const pat of shortFallback) {
    const idx = lower.indexOf(pat.short);
    if (idx > 0) {
      const actualShort = word.slice(idx, idx + pat.short.length);
      const wrongWord = word.slice(0, idx) + pat.long + word.slice(idx + pat.short.length);
      const gappedWord = word.slice(0, idx) + "___" + word.slice(idx + pat.short.length);
      return { word, wrongWord, gappedWord, longPart: pat.long, shortPart: actualShort, hasLong: false };
    }
  }
  return null;
}

function analyzeJlyWord(word) {
  const lower = word.toLowerCase();
  const patterns = [
    { target: "lly", alt: "jj" },
    { target: "jj", alt: "lly" },
    { target: "ly", alt: "j" },
    { target: "j", alt: "ly" }
  ];
  for (const p of patterns) {
    const idx = lower.indexOf(p.target);
    if (idx !== -1) {
      const actualCorrect = word.slice(idx, idx + p.target.length);
      const isCap = (idx === 0 && word[0] === word[0].toUpperCase());
      const actualWrong = isCap ? p.alt[0].toUpperCase() + p.alt.slice(1) : p.alt;
      const wrongWord = word.slice(0, idx) + actualWrong + word.slice(idx + p.target.length);
      const gappedWord = word.slice(0, idx) + "___" + word.slice(idx + p.target.length);
      return { word, wrongWord, gappedWord, correctPart: actualCorrect, wrongPart: actualWrong };
    }
  }
  return null;
}

function getClueForWord(word) {
  if (CUSTOM_CLUES[word]) return CUSTOM_CLUES[word];
  const jlyObj = JLY_LIST.find(x => x.w === word);
  if (jlyObj && jlyObj.hint) return "Jelentése: " + jlyObj.hint;
  const info = analyzeWord(word);
  if (info) {
    return info.hasLong
      ? "Figyelj! A szóban egy hosszú mássalhangzó (" + info.longPart + ") szerepel."
      : "Figyelj! Ebben a szóban rövid mássalhangzó áll.";
  }
  return "Rakd sorba a betűket, hogy értelmes magyar szót kapj!";
}

const STORE_KEY = "helyesiras_kaland_v3";
let state = JSON.parse(localStorage.getItem(STORE_KEY) || "null") || {
  current: "Játékos",
  users: { "Játékos": { pts: 0, mastered: [], practiced: [], mistakes: [] } }
};

function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function curUser() {
  if (!state.users[state.current]) {
    state.users[state.current] = { pts: 0, mastered: [], practiced: [], mistakes: [] };
  }
  if (!state.users[state.current].practiced) {
    state.users[state.current].practiced = [...state.users[state.current].mastered];
  }
  return state.users[state.current];
}

  } else {
    document.getElementById("rank-bar").style.width = "100%";
    document.getElementById("rank-next").textContent = "Legmagasabb szint elérve!";
  }

  const mBtn = document.getElementById("btn-mistakes");
  if (u.mistakes.length > 0) {
    mBtn.style.display = "flex";
    document.getElementById("mistake-cnt").textContent = u.mistakes.length;
  } else {
    mBtn.style.display = "none";
  }
  updateMonitorBar();
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  if (id === "scr-home") updateHome();
  if (id === "scr-users") renderUsers();
  updateMonitorBar();
}

function goHome() {
  document.getElementById("sheet").classList.remove("on");
  showScreen("scr-home");
}

function renderUsers() {
  const list = document.getElementById("user-list");
  list.innerHTML = "";
  Object.keys(state.users).forEach(name => {
    const btn = document.createElement("button");
    btn.className = "profile" + (name === state.current ? " cur" : "");
    btn.innerHTML = "<span>👤 " + name + "</span><span>" + state.users[name].pts + " p</span>";
    btn.addEventListener("click", () => {
      state.current = name;
      sessionFlawless = 0;
      saveState();
      goHome();
    });
    list.appendChild(btn);
  });
}

function addUser() {
  const inp = document.getElementById("new-user-inp");
  const name = inp.value.trim();
  if (!name) return;
  if (!state.users[name]) {
    state.users[name] = { pts: 0, mastered: [], practiced: [], mistakes: [] };
  }
  state.current = name;
  sessionFlawless = 0;
  inp.value = "";
  saveState();
  goHome();
}

let queue = [];
let qIndex = 0;
let sessionScore = 0;
let combo = 0;
let lastMode = "mixed";
let currentTask = null;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(mode) {
  lastMode = mode;
  qIndex = 0;
  sessionScore = 0;
  sessionFlawless = 0;
  combo = 0;
  queue = [];
  updateMonitorBar();

  if (mode === "pairs") {
    queue = shuffle(PAIR_TASKS).slice(0, 10).map(p => ({ type: "pair", data: p }));
  } else if (mode === "jly") {
    queue = shuffle(JLY_LIST).slice(0, 10).map(item => ({ type: "jly", item }));
  } else if (mode === "mistakes") {
    const m = curUser().mistakes;
    queue = shuffle(m).slice(0, 10).map(w => {
      const jlyFound = JLY_LIST.find(x => x.w === w);
      if (jlyFound && analyzeJlyWord(w)) return { type: "jly", item: jlyFound };
      return { type: "choice", word: w };
    });
  } else if (mode === "mixed") {
    const mPool = shuffle(M_LIST).slice(0, 7);
    const jPool = shuffle(JLY_LIST).slice(0, 3);
    const rawTasks = [
      { type: "choice", word: mPool[0] },
      { type: "jly", item: jPool[0] },
      { type: "gap", word: mPool[1] },
      { type: "tiles", word: mPool[2] },
      { type: "jly", item: jPool[1] },
      { type: "choice", word: mPool[3] },
      { type: "gap", word: mPool[4] },
      { type: "jly", item: jPool[2] },
      { type: "tiles", word: mPool[5] },
      { type: "choice", word: mPool[6] }
    ];
    queue = shuffle(rawTasks);
  } else {
    const pool = shuffle(M_LIST).slice(0, 10);
    queue = pool.map(w => ({ type: mode, word: w }));
  }

  showScreen("scr-quiz");
  renderQuestion();
}

function makeOptionButtons(opts, correctWord, fullWord, container) {
  const wrap = document.createElement("div");
  wrap.className = "opts";
  opts.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = o;
    btn.addEventListener("click", () => checkChoice(btn, o, correctWord, fullWord));
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
}

function renderQuestion() {
  answered = false;
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("q-prog").style.width = ((qIndex / queue.length) * 100) + "%";
  document.getElementById("q-score").textContent = sessionScore + " p";
  document.getElementById("q-combo").textContent = combo >= 2 ? "🔥 " + combo + "x" : "";

  currentTask = queue[qIndex];
  const body = document.getElementById("q-body");
  const tag = document.getElementById("q-tag");
  const title = document.getElementById("q-title");
  body.innerHTML = "";

  if (currentTask.type === "pair") {
    const p = currentTask.data;
    tag.textContent = "Jelentéskülönbség";
    tag.style.background = "#db2777";
    title.textContent = "Melyik szó illik a mondatba? (" + p.hint + ")";
    const sent = document.createElement("div");
    sent.className = "sentence-display";
    sent.innerHTML = p.s.replace("___", '<span class="gap" id="gap-span">?</span>');
    body.appendChild(sent);
    makeOptionButtons(shuffle([p.ok, p.bad]), p.ok, p.ok, body);
    return;
  }

  if (currentTask.type === "jly") {
    const jObj = currentTask.item;
    const jInfo = analyzeJlyWord(jObj.w);
    tag.textContent = "j vagy ly gyakorló";
    tag.style.background = "#ea580c";
    title.textContent = "Válaszd ki a helyesen írt alakot!";
    if (jObj.hint) {
      const clue = document.createElement("div");
      clue.className = "clue-box";
      clue.textContent = "💡 Jelentése: " + jObj.hint;
      body.appendChild(clue);
    } else {
      const disp = document.createElement("div");
      disp.className = "word-display";
      disp.textContent = "✍️";
      body.appendChild(disp);
    }
    makeOptionButtons(shuffle([jInfo.word, jInfo.wrongWord]), jInfo.word, jInfo.word, body);
    return;
  }

  const word = currentTask.word;
  const info = analyzeWord(word);

  if (currentTask.type === "choice" && info) {
    tag.textContent = "Rövid vagy hosszú?";
    tag.style.background = "#2563eb";
    title.textContent = "Kattints a helyesen leírt szóra!";
    const disp = document.createElement("div");
    disp.className = "word-display";
    disp.textContent = "🤔";
    body.appendChild(disp);
    makeOptionButtons(shuffle([info.word, info.wrongWord]), info.word, info.word, body);
  } else if (currentTask.type === "gap" && info) {
    tag.textContent = "Betűpótló";
    tag.style.background = "#ca8a04";
    title.textContent = "Melyik betűkapcsolat hiányzik a szóból?";
    const correctOpt = info.hasLong ? info.longPart : info.shortPart;
    const wrongOpt = info.hasLong ? info.shortPart : info.longPart;
    const disp = document.createElement("div");
    disp.className = "word-display";
    disp.innerHTML = info.gappedWord.replace("___", '<span class="gap" id="gap-span">__</span>');
    body.appendChild(disp);
    makeOptionButtons(shuffle([correctOpt, wrongOpt]), correctOpt, info.word, body);
  } else {
    tag.textContent = "Betűkirakó";
    tag.style.background = "#0d9488";
    title.textContent = "Olvasd el a segítséget, és rakd ki a szót a csempékből!";
    renderTilePuzzle(word, body);
  }
}

function checkChoice(btn, chosen, correct, fullWord) {
  if (answered) return;
  answered = true;
  document.querySelectorAll(".opt").forEach(b => {
    if (b.textContent === correct) b.classList.add("ok");
    else if (b === btn) b.classList.add("bad");
    else b.classList.add("dim");
  });
  const gapSpan = document.getElementById("gap-span");
  if (gapSpan) gapSpan.textContent = correct;
  finishAnswer(chosen === correct, fullWord);
}

let tileTarget = "";
let tilePlaced = [];

function renderTilePuzzle(word, container) {
  tileTarget = word;
  tilePlaced = [];
  const chars = word.split("");
  const shuffled = shuffle(chars.map((c, idx) => ({ c, idx })));

  const clue = document.createElement("div");
  clue.className = "clue-box";
  clue.textContent = "💡 " + getClueForWord(word);
  container.appendChild(clue);

  const slotRow = document.createElement("div");
  slotRow.className = "slotrow";
  slotRow.id = "slot-row";
  container.appendChild(slotRow);

  const poolDiv = document.createElement("div");
  poolDiv.className = "tiles";
  poolDiv.id = "tile-pool";
  shuffled.forEach(item => {
    const tBtn = document.createElement("button");
    tBtn.className = "tile";
    tBtn.id = "t-" + item.idx;
    tBtn.textContent = item.c === " " ? "␣" : item.c;
    tBtn.addEventListener("click", () => pickTile(item.idx, item.c));
    poolDiv.appendChild(tBtn);
  });
  container.appendChild(poolDiv);

  const resetWrap = document.createElement("div");
  resetWrap.style.marginTop = "14px";
  const resetBtn = document.createElement("button");
  resetBtn.className = "secondary";
  resetBtn.textContent = "↺ Újrakezdés";
  resetBtn.addEventListener("click", clearTiles);
  resetWrap.appendChild(resetBtn);
  container.appendChild(resetWrap);
}

function pickTile(idx, char) {
  if (answered) return;
  const btn = document.getElementById("t-" + idx);
  if (btn.classList.contains("used")) return;
  btn.classList.add("used");
  tilePlaced.push({ idx, char });
  updateSlots();

  if (tilePlaced.length === tileTarget.length) {
    answered = true;
    const built = tilePlaced.map(x => x.char).join("");
    finishAnswer(built === tileTarget, tileTarget);
  }
}

function updateSlots() {
  const row = document.getElementById("slot-row");
  row.innerHTML = "";
  tilePlaced.forEach((item, pos) => {
    const pBtn = document.createElement("button");
    pBtn.className = "tile placed";
    pBtn.textContent = item.char === " " ? "␣" : item.char;
    pBtn.addEventListener("click", () => removeTile(pos));
    row.appendChild(pBtn);
  });
}

function removeTile(pos) {
  if (answered) return;
  const removed = tilePlaced.splice(pos, 1)[0];
  document.getElementById("t-" + removed.idx).classList.remove("used");
  updateSlots();
}

function clearTiles() {
  if (answered) return;
  tilePlaced = [];
  document.querySelectorAll("#tile-pool .tile").forEach(b => b.classList.remove("used"));
  updateSlots();
}

function finishAnswer(isOk, fullWord) {
  const u = curUser();
  const sheet = document.getElementById("sheet");
  const shHead = document.getElementById("sh-head");
  const shFull = document.getElementById("sh-full");

  if (ALL_UNIQUE_WORDS.has(fullWord) && !u.practiced.includes(fullWord)) {
    u.practiced.push(fullWord);
  }

  if (isOk) {
    combo++;
    const gain = 10 + (combo >= 3 ? 5 : 0);
    sessionScore += gain;
    sessionFlawless++;
    u.pts += gain;
    if (!u.mastered.includes(fullWord)) {
      u.mastered.push(fullWord);
    }
    u.mistakes = u.mistakes.filter(w => w !== fullWord);

    sheet.className = "sheet ok on";
    shHead.textContent = combo >= 3 ? "Szuper! (+" + gain + " pont, " + combo + "x sorozat!)" : "Helyes! (+" + gain + " pont)";
    shFull.textContent = "Helyes alak: " + fullWord;
  } else {
    combo = 0;
    if (!u.mistakes.includes(fullWord)) {
      u.mistakes.push(fullWord);
    }
    sheet.className = "sheet bad on";
    shHead.textContent = "Most nem talált!";
    shFull.textContent = "A helyes írásmód: " + fullWord;
  }

  saveState();
  updateMonitorBar();
  document.getElementById("q-score").textContent = sessionScore + " p";
}

function nextQuestion() {
  qIndex++;
  if (qIndex < queue.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById("sheet").classList.remove("on");
  showScreen("scr-res");
  const ratio = sessionFlawless / queue.length;
  const stars = ratio === 1 ? "⭐⭐⭐" : (ratio >= 0.7 ? "⭐⭐☆" : "⭐☆☆");
  document.getElementById("res-stars").textContent = stars;
  document.getElementById("res-head").textContent = ratio === 1 ? "Hibátlan teljesítmény!" : "Kör teljesítve!";
  document.getElementById("res-sub").textContent = queue.length + " szóból " + sessionFlawless + " hibátlan • Szerzett pontok: " + sessionScore + " p";
}

document.getElementById("btn-mixed").addEventListener("click", () => startQuiz("mixed"));
document.getElementById("btn-choice").addEventListener("click", () => startQuiz("choice"));
document.getElementById("btn-jly").addEventListener("click", () => startQuiz("jly"));
document.getElementById("btn-gap").addEventListener("click", () => startQuiz("gap"));
document.getElementById("btn-tiles").addEventListener("click", () => startQuiz("tiles"));
document.getElementById("btn-pairs").addEventListener("click", () => startQuiz("pairs"));
document.getElementById("btn-mistakes").addEventListener("click", () => startQuiz("mistakes"));
document.getElementById("btn-switch-user").addEventListener("click", () => showScreen("scr-users"));
document.getElementById("btn-add-user").addEventListener("click", addUser);
document.getElementById("btn-quit").addEventListener("click", goHome);
document.getElementById("btn-again").addEventListener("click", () => startQuiz(lastMode));
document.getElementById("btn-home").addEventListener("click", goHome);
document.getElementById("sh-next").addEventListener("click", nextQuestion);

updateHome();
</script>
